<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastro / Atualização — Prevent Senior</title><link rel="stylesheet" href="style.css"></head><body><div class="demo"<main class="login"><div class="logo">PREVENT <span>SENIOR</span><b>✓</b></div><h1>Atualize seu cadastro</h1><p class="subtitle">Cadastro / Atualização</p><label for="nome">Nome</label><input id="nome" type="text" autocomplete="name" placeholder="Digite seu nome"><label for="cpf">CPF</label><input id="cpf" type="text" inputmode="numeric" autocomplete="off" placeholder="Digite seu CPF"><label for="nasc">Data de nascimento</label><input id="nasc" type="date"><label for="senha">Senha</label><input id="senha" type="password" autocomplete="new-password" placeholder="Crie uma senha"><label for="confirm">Confirme sua senha</label><input id="confirm" type="password" autocomplete="new-password" placeholder="Digite a senha novamente"><div id="msg" class="msg" hidden></div><button class="enter" id="confirmar">CONFIRMAR</button><button class="back" onclick="location.href='index.html'">VOLTAR</button></main><script>const $=id=>document.getElementById(id);$('confirmar').onclick=()=>{const nome=$('nome').value.trim(),cpf=$('cpf').value.trim(),nasc=$('nasc').value,senha=$('senha').value,confirm=$('confirm').value,msg=$('msg');if(!nome||!cpf||!nasc||!senha||!confirm){msg.hidden=false;msg.textContent='Preencha todos os campos.';return}if(senha!==confirm){msg.hidden=false;msg.textContent='As senhas não conferem.';return}const req={id:Date.now().toString(),nome,cpfMascarado:cpf.length>4?'***.***.***-'+cpf.slice(-2):'***',dataNascimento:nasc,senhaCadastrada:true,senhaConfirmada:true,status:'AGUARDANDO APROVAÇÃO',criadoEm:new Date().toISOString()};const lista=JSON.parse(localStorage.getItem('preventDemoRegistrations')||'[]');lista.push(req);localStorage.setItem('preventDemoRegistrations',JSON.stringify(lista));localStorage.setItem('preventDemoLastCpf',cpf);localStorage.removeItem('preventDemoLastPassword');location.href='entrar.html'};</script></body></html>
